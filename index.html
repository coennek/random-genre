<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Genre</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #B3B3B3; margin-bottom: 8px; }
    #status { font-size: 0.85rem; color: #1DB954; margin-bottom: 24px; }
    #genre-card {
      background: #181818;
      border-radius: 12px;
      padding: 30px 20px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 30px;
      border: 1px solid #282828;
    }
    #genre-name { font-size: 1.4rem; font-weight: bold; min-height: 50px; display: flex; align-items: center; justify-content: center; }
    button {
      background-color: #1DB954;
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      padding: 16px 32px;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 350px;
    }
    button:disabled { background-color: #535353; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>EveryNoise Randomizer</h1>
  <div id="status">Loading genres...</div>

  <div id="genre-card">
    <div id="genre-name">Tap below to pick</div>
  </div>

  <button id="btn" onclick="pickGenre()" disabled> Pick Random Genre</button>

<script>
    let genres = [];

    async function init() {
      try {
        const res = await fetch('./genres.json');
        if (!res.ok) throw new Error('Failed to load file');
        genres = await res.json();

        document.getElementById('status').textContent = `Loaded ${genres.length.toLocaleString()} genres`;
        document.getElementById('btn').disabled = false;
      } catch (err) {
        document.getElementById('status').textContent = 'Error loading genres.json';
      }
    }

    function pickGenre() {
      if (!genres.length) return;
      const selected = genres[Math.floor(Math.random() * genres.length)];
      document.getElementById('genre-name').textContent = selected.name;
      
      let deepLink = selected.url;

      // Wandelt Web-URLs in native Spotify-App-Links um
      if (deepLink.includes('open.spotify.com/playlist/')) {
        const playlistId = deepLink.split('/playlist/')[1].split('?')[0];
        deepLink = `spotify:playlist:${playlistId}`;
      } else if (deepLink.includes('open.spotify.com/search/')) {
        const query = deepLink.split('/search/')[1].replace('/playlists', '');
        deepLink = `spotify:search:${query}`;
      }

      setTimeout(() => {
        window.location.href = deepLink;
      }, 300);
    }

    init();
  </script>
</body>
</html>
