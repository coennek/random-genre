<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Genre</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; color: #B3B3B3; margin-bottom: 8px; }
    #status { font-size: 0.85rem; color: #1DB954; margin-bottom: 24px; }
    #genre-card {
      background: #181818;
      border-radius: 12px;
      padding: 30px 20px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 30px;
      border: 1px solid #282828;
    }
    #genre-name { font-size: 1.4rem; font-weight: bold; min-height: 50px; display: flex; align-items: center; justify-content: center; }
    button {
      background-color: #1DB954;
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      padding: 16px 32px;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 350px;
    }
    button:disabled { background-color: #535353; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>EveryNoise Randomizer</h1>
  <div id="status">Fetching genres...</div>

  <div id="genre-card">
    <div id="genre-name">Tap below to pick</div>
  </div>

  <button id="btn" onclick="pickGenre()" disabled>🎲 Pick Random Genre</button>

  <script>
    let genres = [];
    const PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];

    async function fetchHtml() {
      const targetUrl = 'https://everynoise.com/everynoise1d.html';
      for (const proxyGen of PROXIES) {
        try {
          const res = await fetch(proxyGen(targetUrl));
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 5000) return text;
          }
        } catch (e) {
          console.warn('Proxy failed, trying next...');
        }
      }
      return null;
    }

    async function init() {
      const html = await fetchHtml();
      
      if (html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const rows = doc.querySelectorAll('tr, div, td');
        
        rows.forEach(row => {
          let name = '';
          let url = '';
          
          row.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href') || '';
            const text = a.textContent.trim();
            
            if (href.includes('spotify.com/playlist') || href.includes('spotify:playlist')) {
              url = href;
            } else if (!href.startsWith('javascript') && text && text !== '>>' && text !== 'note' && text !== 'map') {
              name = text;
            }
          });

          if (name) {
            if (!url) {
              url = `https://open.spotify.com/search/${encodeURIComponent('The Sound of ' + name)}/playlists`;
            }
            genres.push({ name, url });
          }
        });
      }

      if (genres.length > 0) {
        document.getElementById('status').textContent = `Loaded ${genres.length.toLocaleString()} genres`;
        document.getElementById('btn').disabled = false;
      } else {
        document.getElementById('status').textContent = 'Error loading live genres. Please refresh.';
      }
    }

    function pickGenre() {
      if (!genres.length) return;
      const selected = genres[Math.floor(Math.random() * genres.length)];
      document.getElementById('genre-name').textContent = selected.name;
      
      setTimeout(() => {
        window.location.href = selected.url;
      }, 300);
    }

    init();
  </script>
</body>
</html>
